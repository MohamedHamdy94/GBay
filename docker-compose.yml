services:
  postgres:
    image: postgres:16
    container_name: gbay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbay
      POSTGRES_PASSWORD: gbay
      POSTGRES_DB: gbay
    ports:
      - "5432:5432"
    volumes:
      - gbay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbay -d gbay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gbay_postgres_data:
